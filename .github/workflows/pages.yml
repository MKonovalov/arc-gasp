name: Deploy Portal

# Builds the arc-gasp public portal (scripts/build_site.py -> ./site) and
# publishes it to the DEDICATED PUBLIC repo MKonovalov/arc-gasp-site, served at
# arc-gasp.arclumen.de via GitHub Pages.
#
# Private repo -> public Pages requires a cross-repo publish. Instead of a
# shared broad PAT, this uses a per-target WRITE DEPLOY KEY (DEPLOY_KEY secret
# on this repo), pushed over SSH. The key is added to arc-gasp-site only; it
# cannot touch any other repo.
#
# One-time setup (already done by Hermes):
#   - MKonovalov/arc-gasp-site exists and is PUBLIC (gh-pages branch seeded).
#   - A write deploy key (title "arc-gasp portal deploy (write)") is added to
#     arc-gasp-site; its private half is the DEPLOY_KEY secret here.
#   - Pages source on arc-gasp-site: Deploy from a branch -> gh-pages / root.
#   - Cloudflare DNS: CNAME arc-gasp.arclumen.de -> MKonovalov.github.io, and
#     the custom domain arc-gasp.arclumen.de enabled in arc-gasp-site Pages
#     settings (with the issued TLS cert).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "scripts/build_site.py"
      - "identity/**"
      - "journal/**"
      - "state/**"
      - "skills/**"
      - "DAY_COUNT"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build portal
        run: python3 scripts/build_site.py

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/portal_key
          chmod 600 ~/.ssh/portal_key
          # Trust github.com host key (avoids interactive prompt)
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      # Publish ./site to the public repo's gh-pages branch over SSH.
      # No destination_dir -> publish to repo ROOT, so the CNAME emitted by
      # build_site.py lands at gh-pages/CNAME (required for arc-gasp.arclumen.de).
      - name: Deploy to public site repo (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          publish_dir: ./site
          external_repository: MKonovalov/arc-gasp-site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "deploy portal: ${{ github.sha }}"
